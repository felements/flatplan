name: Publish to MS Store

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        run: |
          # Fetch main branch to check ancestry
          git fetch origin main
          
          # Check if the commit of the current tag (HEAD) is an ancestor of origin/main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Release is from main branch. Proceeding."
          else
            echo "Release is not from main branch! Aborting MS Store publish safely."
            # Exit safely so that it doesn't show as a failing action
            exit 0
          fi

      - name: Download MSIX from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.event.release.tag_name }} --pattern "*.msix"
          
          # Ensure there is exactly one MSIX file downloaded
          MSIX_FILE=$(ls *.msix | head -n 1)
          if [ -z "$MSIX_FILE" ]; then
            echo "::error::Could not find .msix file in the release assets"
            exit 1
          fi
          
          echo "MSIX_PATH=$MSIX_FILE" >> $GITHUB_ENV

      - name: Publish MSIX to Microsoft Store
        uses: microsoft/store-submission@v1
        with:
          tenant-id: ${{ secrets.TENANT_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          seller-id: ${{ secrets.SELLER_ID }}
          app-id: ${{ secrets.APP_ID }}
          package-path: ${{ env.MSIX_PATH }}
